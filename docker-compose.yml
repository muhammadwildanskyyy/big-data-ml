services:
  namenode:
    image: apache/hadoop:3
    container_name: namenode
    platform: linux/amd64
    hostname: namenode
    user: root
    command: >
      bash -c "mkdir -p /tmp/hadoop-data/name &&
      if [ ! -d /tmp/hadoop-data/name/current ]; then
        hdfs namenode -format -force -nonInteractive;
      fi &&
      hdfs namenode"
    ports:
      - "9870:9870"
      - "8020:8020"
    env_file:
      - ./docker/hadoop.env
    volumes:
      - namenode_data:/tmp/hadoop-data/name
      - ./data:/opt/data:ro
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  datanode:
    image: apache/hadoop:3
    container_name: datanode
    platform: linux/amd64
    hostname: datanode
    user: root
    command: >
      bash -c "mkdir -p /tmp/hadoop-data/data && hdfs datanode"
    ports:
      - "9864:9864"
    env_file:
      - ./docker/hadoop.env
    volumes:
      - datanode_data:/tmp/hadoop-data/data
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - bigdata-net

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    env_file:
      - .env
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - HDFS_NAMENODE_HOST=${HDFS_NAMENODE_HOST:-namenode}
      - HDFS_NAMENODE_PORT=${HDFS_NAMENODE_PORT:-8020}
      - SPARK_MASTER_URL=${SPARK_MASTER_URL:-spark://spark-master:7077}
      - MONGO_HOST=${MONGO_HOST:-mongodb}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_DB=${MONGO_DB:-air_quality_db}
      - MONGO_USER=${MONGO_USER:-bigdata}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-bigdata_secret}
    volumes:
      - .:/opt/app
    depends_on:
      - namenode
      - datanode
      - mongodb
    networks:
      - bigdata-net

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    ports:
      - "8081:8081"
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    volumes:
      - .:/opt/app
    depends_on:
      - spark-master
    networks:
      - bigdata-net

  mongodb:
    image: mongo:7
    container_name: mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-bigdata}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-bigdata_secret}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-air_quality_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  namenode_data:
  datanode_data:
  mongo_data:

networks:
  bigdata-net:
    driver: bridge
